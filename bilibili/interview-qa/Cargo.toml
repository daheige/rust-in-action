[package]
name = "interview-qa"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "advance-qa"
path = "src/advance.rs"

[[bin]]
name = "hello-debug"
path = "src/hello-debug.rs"

[[bin]]
name = "console-sub"
path = "src/console-sub.rs"

# Cargo.toml —— 保留 debug 符号，同时优化体积
# 事前准备（编译时就要做对）
# release 构建保留符号 symbols 并归档
[profile.release]
debug = true          # 生成符号表，core dump / perf 用得上
strip = "debuginfo"   # 或者不 strip，二选一看磁盘/包大小策略
lto = true            # 优化别关
codegen-units = 1
#panic = "abort"

[dependencies]
tokio = { version = "1.53.1", features = ["full"] }

# 用于抓取异步任务运行状态（仅本地调试，线上勿开）
console-subscriber = { version = "0.5", optional = true }

[features]
tokio-console = ["dep:console-subscriber"]
